# Bulk RNA-seq module rulebook (starter). Team review required before v1.0.
version: "0.1.0"
rules:
  - id: rnaseq.depth.gene_level
    when: {question.goal: gene_level_de, library.prep: {in: [polyA, rRNA_depletion]}}
    recommend: {sequencing.target_reads_per_sample: 30000000}
    severity: suggest
    rationale: >
      ENCODE4 targets 30M aligned reads per replicate for bulk RNA-seq (20M in older
      projects). For DE, additional replicates add more power than depth beyond ~20-30M.
    source: encode

  - id: rnaseq.depth.isoform
    when: {question.goal: {in: [isoform, splicing, fusion]}}
    recommend: {sequencing.target_reads_per_sample: 60000000, sequencing.paired_end: true}
    severity: strong
    rationale: "Isoform/splicing/fusion analyses need paired-end reads and greater depth than gene-level DE."
    source: team

  - id: rnaseq.prep.degraded
    when: {sample.preservation: ffpe}
    recommend: {library.prep: rRNA_depletion}
    severity: strong
    rationale: >
      FFPE RNA is fragmented; poly(A) capture loses 5' coverage. Use rRNA depletion and
      assess quality by DV200 rather than RIN.
    ask_if_missing: [sample.dv200]
    source: team

  # --- RNA integrity gate (thresholds: team-adopted, derived from vendor guidance; not ENCODE) ---
  - id: rnaseq.quality.low_rin
    when: {sample.preservation: {in: [fresh_frozen, fresh]}, sample.rin: {lt: 7}}
    recommend: {library.prep: rRNA_depletion}
    severity: suggest
    rationale: >
      RIN below 7 indicates partial degradation. Poly(A) capture then biases coverage toward
      the 3' end; rRNA depletion is more robust to degradation. Also measure DV200, which is
      more informative than RIN for degraded RNA.
    ask_if_missing: [sample.dv200]
    source: team

  - id: rnaseq.quality.dv200_low
    when: {sample.dv200: {lt: 30}}
    recommend: {library.prep: rRNA_depletion}
    severity: strong
    consult: true
    rationale: >
      DV200 below 30% means most RNA fragments are shorter than 200 nt. Library yield and
      complexity are likely to be poor and many samples may fail. Discuss with the
      Bioinformatics team before committing samples (re-extraction, more input, or excluding
      samples). Threshold adopted by the team from library-kit vendor guidance; not an ENCODE standard.
    source: team

  - id: rnaseq.quality.dv200_moderate
    when: {sample.dv200: {gte: 30, lt: 50}}
    recommend: {library.prep: rRNA_depletion}
    severity: info
    rationale: >
      DV200 of 30-50% indicates moderately degraded RNA. rRNA depletion is appropriate; expect
      lower library complexity than intact RNA. Threshold adopted by the team from library-kit
      vendor guidance; not an ENCODE standard.
    source: team

  - id: rnaseq.prep.intact_standard
    when: {sample.preservation: {in: [fresh_frozen, fresh]}, question.goal: gene_level_de, sample.rin: {gte: 7}}
    recommend: {library.prep: polyA}
    severity: suggest
    rationale: "Intact RNA and a gene-level question: poly(A) selection is the standard, cost-effective choice."
    source: team

  - id: rnaseq.prep.whole_blood_globin
    when: {sample.source: whole_blood}
    recommend: {library.globin_depletion: true}
    severity: strong
    rationale: >
      Globin transcripts can consume a large share of reads in whole blood, reducing
      effective depth for other genes.
    ask_if_missing: [sample.collection_tube]
    source: team

  - id: rnaseq.prep.pbmc
    when: {sample.source: pbmc}
    recommend: {library.globin_depletion: false}
    severity: info
    rationale: "PBMCs generally do not need globin depletion; note any RBC contamination during isolation."
    source: team

  - id: rnaseq.pdx.host_reads
    when: {sample.source: pdx}
    recommend: {analysis.host_read_removal: true}
    severity: strong
    rationale: "PDX tissue contains mouse stroma; plan computational removal of mouse reads (e.g. combined reference)."
    source: team

  - id: rnaseq.spikein.global_change
    when: {question.expected_global_transcription_change: true}
    recommend: {library.spike_in: ERCC_per_cell_number}
    severity: strong
    rationale: >
      Standard normalization assumes most genes are unchanged. If the perturbation may shift
      total transcription (e.g. degrons of global regulators, transcription inhibitors),
      add spike-ins proportional to cell number, not to RNA mass.
    ask_if_missing: [sample.cell_counts_available]
    source: team

  - id: rnaseq.spikein.not_needed
    when: {question.expected_global_transcription_change: false, question.goal: gene_level_de}
    recommend: {library.spike_in: none}
    severity: info
    rationale: "Spike-ins are not required for standard differential expression."
    source: team

  - id: rnaseq.knockdown.control
    when: {design.perturbation_type: {in: [shRNA, siRNA, CRISPR_KO, CRISPRi]}}
    recommend: {design.matched_nontargeting_control: true}
    severity: strong
    rationale: "ENCODE requires a matched control experiment for knockdown/CRISPR RNA-seq; include non-targeting controls."
    source: encode

  - id: rnaseq.low_input
    when: {sample.input_ng: {lt: 10}}
    recommend: {library.prep: low_input_full_length, library.umi: true}
    severity: strong
    rationale: "Very low input libraries have high duplication; use a low-input chemistry and UMIs."
    source: team

  # --- Rule 2: strandedness ---
  - id: rnaseq.library.stranded_default
    when: {library.stranded: {exists: false}}
    recommend: {library.stranded: true}
    severity: info
    rationale: >
      Stranded libraries record which DNA strand each transcript came from. This resolves
      overlapping and antisense genes and is required to quantify antisense/lncRNA
      transcription. Stranded kits are now the default at most cores at little or no extra cost.
    source: team

  - id: rnaseq.library.unstranded
    when: {library.stranded: false}
    recommend: {library.stranded: true}
    severity: suggest
    rationale: >
      An unstranded library cannot assign reads to the correct strand where genes overlap on
      opposite strands, which mis-assigns counts for a few percent of genes and rules out
      antisense analysis. Use unstranded only to match an existing unstranded dataset.
    source: team

  # --- Rule 3: 3' tag-counting libraries (e.g. QuantSeq, BRB-seq) ---
  - id: rnaseq.prep.three_prime_tag_incompatible
    when: {library.prep: three_prime_tag, question.goal: {in: [isoform, splicing, fusion, lncRNA]}}
    recommend: {}
    severity: block
    rationale: >
      3' tag libraries sequence only the 3' end of polyadenylated transcripts. They cannot
      resolve isoforms, splice junctions or fusions, and miss non-polyadenylated lncRNAs.
      Use a full-length library (poly(A) or rRNA depletion) for this question.
    source: team

  - id: rnaseq.prep.three_prime_tag_option
    when: {question.goal: gene_level_de, design.n_samples: {gte: 96}, library.prep: {exists: false}}
    recommend: {}
    severity: info
    rationale: >
      With 96 or more samples and a gene-level question, a 3' tag-counting library is a
      cost-effective option: lower per-sample library cost and roughly 5-10M reads per sample.
      Trade-offs: no isoform information, and 3' bias makes it less suitable for degraded RNA
      from some sources. Discuss with the Bioinformatics team if budget is the constraint.
    source: team

  - id: rnaseq.depth.three_prime_tag
    when: {library.prep: three_prime_tag}
    recommend: {sequencing.target_reads_per_sample: 10000000, sequencing.paired_end: false}
    severity: suggest
    rationale: >
      3' tag libraries yield one read per transcript end, so gene-level counts saturate at
      lower depth than full-length libraries; about 10M reads per sample, single-end, is
      sufficient. Not an ENCODE standard (ENCODE does not cover 3' tag RNA-seq).
    source: team

  # --- Rule 4: knockdown / CRISPR depth floor ---
  - id: rnaseq.knockdown.depth_floor
    when: {design.perturbation_type: {in: [shRNA, siRNA, CRISPR_KO, CRISPRi]}}
    recommend: {}
    severity: info
    rationale: >
      ENCODE's floor for knockdown/CRISPR RNA-seq is 10M aligned reads per replicate. That is a
      QC minimum for detecting the targeted knockdown, not a target for genome-wide DE; the
      gene-level depth recommendation (30M) still applies.
    source: encode

  # --- Rule 5: ERCC spike-in amount ---
  - id: rnaseq.spikein.ercc_fraction
    when: {library.spike_in: {in: [ERCC, ERCC_per_cell_number]}}
    recommend: {library.spike_in_target_fraction: 0.02}
    severity: suggest
    rationale: >
      ENCODE uses ERCC (Ambion) Mix 1 at about 2% of mapped reads. Too little gives noisy
      spike-in estimates; too much wastes sequencing depth on spike-ins.
    source: encode

  # --- Rule 6: lncRNA ---
  - id: rnaseq.lncrna.library
    when: {question.goal: lncRNA}
    recommend: {library.prep: rRNA_depletion, library.stranded: true, sequencing.target_reads_per_sample: 50000000}
    severity: strong
    rationale: >
      Many lncRNAs are not polyadenylated, are often antisense to coding genes, and are
      expressed at low levels. Use rRNA depletion (keeps non-polyadenylated RNA), a stranded
      library (resolves antisense transcripts) and deeper sequencing (~50M reads).
    source: team

  # --- Whole-blood collection tube ---
  - id: rnaseq.blood.edta_tube
    when: {sample.source: whole_blood, sample.collection_tube: edta}
    recommend: {}
    severity: suggest
    rationale: >
      EDTA tubes do not stabilize RNA; transcript profiles change within hours at room
      temperature. Prefer RNA-stabilizing tubes (PAXgene, Tempus). If EDTA is unavoidable,
      standardize and record time-to-processing for every sample.
    source: team
