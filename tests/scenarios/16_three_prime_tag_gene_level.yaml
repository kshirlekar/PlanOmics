  sample: {organism: human, source: cell_line, preservation: fresh_frozen, rin: 9}
  design: {factors: {compound: [c1, c2, c3, c4, c5, c6, c7, DMSO]}, biological_replicates_per_group: 12}
  library: {prep: three_prime_tag, stranded: true}
expect:
