  not_fires: [rnaseq.depth.gene_level, rnaseq.prep.three_prime_tag_incompatible, rnaseq.prep.three_prime_tag_option]
  recommended: {sequencing.target_reads_per_sample: 10000000, sequencing.paired_end: false}
  consult_required: false
